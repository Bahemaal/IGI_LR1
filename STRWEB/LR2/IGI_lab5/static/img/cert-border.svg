<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <!-- Рамка сертификата для border-image: сетка 3×3 по 30px (border-image-slice: 30) -->
  <g fill="none" stroke-linecap="round">
    <!-- верхняя грань -->
    <path d="M30 6H60"  stroke="#b8862f" stroke-width="4"/>
    <path d="M30 13H60" stroke="#e2c27a" stroke-width="1.5"/>
    <!-- нижняя грань -->
    <path d="M30 84H60" stroke="#b8862f" stroke-width="4"/>
    <path d="M30 77H60" stroke="#e2c27a" stroke-width="1.5"/>
    <!-- левая грань -->
    <path d="M6 30V60"  stroke="#b8862f" stroke-width="4"/>
    <path d="M13 30V60" stroke="#e2c27a" stroke-width="1.5"/>
    <!-- правая грань -->
    <path d="M84 30V60" stroke="#b8862f" stroke-width="4"/>
    <path d="M77 30V60" stroke="#e2c27a" stroke-width="1.5"/>
    <!-- углы -->
    <path d="M6 30V12Q6 6 12 6H30"     stroke="#b8862f" stroke-width="4"/>
    <path d="M13 30V16Q13 13 16 13H30" stroke="#e2c27a" stroke-width="1.5"/>
    <path d="M60 6H78Q84 6 84 12V30"   stroke="#b8862f" stroke-width="4"/>
    <path d="M60 13H74Q77 13 77 16V30" stroke="#e2c27a" stroke-width="1.5"/>
    <path d="M84 60V78Q84 84 78 84H60" stroke="#b8862f" stroke-width="4"/>
    <path d="M77 60V74Q77 77 74 77H60" stroke="#e2c27a" stroke-width="1.5"/>
    <path d="M30 84H12Q6 84 6 78V60"   stroke="#b8862f" stroke-width="4"/>
    <path d="M30 77H16Q13 77 13 74V60" stroke="#e2c27a" stroke-width="1.5"/>
  </g>
  <!-- точки на гранях -->
  <g fill="#b8862f">
    <circle cx="35" cy="21" r="2"/><circle cx="45" cy="21" r="2"/><circle cx="55" cy="21" r="2"/>
    <circle cx="35" cy="69" r="2"/><circle cx="45" cy="69" r="2"/><circle cx="55" cy="69" r="2"/>
    <circle cx="21" cy="35" r="2"/><circle cx="21" cy="45" r="2"/><circle cx="21" cy="55" r="2"/>
    <circle cx="69" cy="35" r="2"/><circle cx="69" cy="45" r="2"/><circle cx="69" cy="55" r="2"/>
  </g>
  <!-- угловые украшения -->
  <g fill="#c9a063" stroke="#b8862f" stroke-width="1">
    <circle cx="21" cy="21" r="3.5"/><circle cx="69" cy="21" r="3.5"/>
    <circle cx="21" cy="69" r="3.5"/><circle cx="69" cy="69" r="3.5"/>
  </g>
</svg>
