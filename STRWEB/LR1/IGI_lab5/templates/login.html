{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post" class="form-card">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<span class="form-error">{{ field.errors }}</span>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn">Войти</button>
    <p class="form-footer-link"><a href="/register/client/">Нет аккаунта? Зарегистрируйтесь</a></p>
</form>
{% endblock %}
