{% extends 'base.html' %}
{% block title %}Отменить запись{% endblock %}
{% block content %}
<h1>Отменить запись?</h1>
<p>Врач: {{ appt.doctor.full_name }} |
    <time datetime="{{ appt.date_time|date:'c' }}">{{ appt.date_time|date:"d.m.Y H:i" }}</time> |
    {{ appt.service.name }}</p>
<form method="post" class="inline-actions">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, отменить</button>
    <a href="/profile/" class="btn btn-sm">Нет, назад</a>
</form>
{% endblock %}
