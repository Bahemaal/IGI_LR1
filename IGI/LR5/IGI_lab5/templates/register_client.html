{% extends 'base.html' %}
{% block title %}Регистрация клиента{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" class="form-card" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        {% if field.errors %}<span class="form-error">{{ field.errors }}</span>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn">Зарегистрироваться</button>
</form>

<script>
/* Клиентская валидация телефона */
document.querySelector('form').addEventListener('submit', function(e) {
    const phone = document.querySelector('[name="phone"]');
    if (phone && !/^\+375 \(\d{2}\) \d{3}-\d{2}-\d{2}$/.test(phone.value)) {
        e.preventDefault();
        alert('Телефон: +375 (29) XXX-XX-XX');
        phone.focus();
    }
});
</script>
{% endblock %}
