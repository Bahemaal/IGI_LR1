{% extends 'base.html' %}
{% block title %}Запись на приём{% endblock %}
{% block content %}
<h1>Запись на приём</h1>
<form method="post" class="form-card" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<span class="form-error">{{ field.errors }}</span>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn">Записаться</button>
</form>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
    const dt = document.querySelector('[name="date_time"]');
    if (dt && new Date(dt.value) < new Date()) {
        e.preventDefault();
        alert('Дата не может быть в прошлом!');
    }
});
</script>
{% endblock %}
